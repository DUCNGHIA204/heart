<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tặng Phươngg 💖</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      overflow: hidden;
      cursor: pointer;
      font-family: "Comic Sans MS", "Poppins", cursive;
      touch-action: none;
    }

    .box {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .center-text {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgb(225, 12, 168);
      font-size: clamp(16px, 4vw, 34px);
      font-style: italic;
      text-align: center;
      z-index: 3;
      padding: 0 10px;
      line-height: 1.4;
    }

    /* Tim khi click */
    .click-heart {
      position: absolute;
      font-size: 24px;
      user-select: none;
      animation: flyUp 1.2s ease-out forwards;
      pointer-events: none;
      opacity: 0.8;
      z-index: 5;
    }

    @keyframes flyUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-120px) scale(1.6); opacity: 0; }
    }

    /* Tim nhỏ theo chuột */
    .heart {
      position: fixed;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%) rotate(45deg);
      animation: floatUp 1.2s ease-out forwards;
      pointer-events: none;
      z-index: 10;
    }
    .heart::before, .heart::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: inherit;
      border-radius: 50%;
    }
    .heart::before { top: -5px; left: 0; }
    .heart::after { top: 0; left: -5px; }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%) rotate(45deg) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -120%) rotate(45deg) scale(1.6); }
    }

    @media (max-width: 600px) {
      .center-text {
        top: 40%;
        transform: translate(-50%, -180%);
        font-size: clamp(14px, 5vw, 28px);
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="center-text">
      Chúc Phương 20-10 mãi xinh đẹp, luôn nở nụ cười trên môi, lúc nào cũng yêu đời và iu mìnhhhh 💞
    </div>
    <canvas id="pinkboard"></canvas>
  </div>

  <script>
    // ---------------- Tim chính (Canvas) ----------------
    var settings = { particles: { length: 8000, duration: 4, velocity: 70, effect: -1.3, size: 8 } };

    (function () {
      var b = 0, c = ["ms", "moz", "webkit", "o"];
      for (var a = 0; a < c.length && !window.requestAnimationFrame; ++a) {
        window.requestAnimationFrame = window[c[a] + "RequestAnimationFrame"];
      }
      if (!window.requestAnimationFrame) {
        window.requestAnimationFrame = function (cb) {
          var curr = new Date().getTime();
          var delay = Math.max(0, 16 - (curr - b));
          var id = setTimeout(() => cb(curr + delay), delay);
          b = curr + delay;
          return id;
        };
      }
    })();

    var Point = function (x, y) { this.x = x || 0; this.y = y || 0; };
    Point.prototype = {
      clone() { return new Point(this.x, this.y); },
      length(l) {
        if (l === undefined) return Math.sqrt(this.x * this.x + this.y * this.y);
        this.normalize(); this.x *= l; this.y *= l; return this;
      },
      normalize() { var l = this.length(); this.x /= l; this.y /= l; return this; }
    };

    var Particle = function () {
      this.position = new Point();
      this.velocity = new Point();
      this.acceleration = new Point();
      this.age = 0;
    };
    Particle.prototype = {
      initialize(x, y, dx, dy) {
        this.position.x = x; this.position.y = y;
        this.velocity.x = dx; this.velocity.y = dy;
        this.acceleration.x = dx * settings.particles.effect;
        this.acceleration.y = dy * settings.particles.effect;
        this.age = 0;
      },
      update(dt) {
        this.position.x += this.velocity.x * dt;
        this.position.y += this.velocity.y * dt;
        this.velocity.x += this.acceleration.x * dt;
        this.velocity.y += this.acceleration.y * dt;
        this.age += dt;
      },
      draw(ctx, img) {
        function ease(t) { return (--t) * t * t + 1; }
        var size = img.width * ease(this.age / settings.particles.duration);
        ctx.globalAlpha = 1 - this.age / settings.particles.duration;
        ctx.drawImage(img, this.position.x - size / 2, this.position.y - size / 2, size, size);
      }
    };

    var ParticlePool = function (length) {
      var particles = new Array(length), firstActive = 0, firstFree = 0,
        duration = settings.particles.duration;
      for (var i = 0; i < length; i++) particles[i] = new Particle();

      this.add = function (x, y, dx, dy) {
        particles[firstFree].initialize(x, y, dx, dy);
        firstFree = (firstFree + 1) % length;
        if (firstFree === firstActive) firstActive = (firstActive + 1) % length;
      };

      this.update = function (dt) {
        if (firstActive < firstFree) {
          for (var i = firstActive; i < firstFree; i++) particles[i].update(dt);
        } else {
          for (var i = firstActive; i < particles.length; i++) particles[i].update(dt);
          for (var i = 0; i < firstFree; i++) particles[i].update(dt);
        }
        while (particles[firstActive].age >= duration && firstActive !== firstFree) {
          firstActive = (firstActive + 1) % length;
        }
      };

      this.draw = function (ctx, img) {
        if (firstActive < firstFree) {
          for (var i = firstActive; i < firstFree; i++) particles[i].draw(ctx, img);
        } else {
          for (var i = firstActive; i < particles.length; i++) particles[i].draw(ctx, img);
          for (var i = 0; i < firstFree; i++) particles[i].draw(ctx, img);
        }
      };
    };

    (function (canvas) {
      var ctx = canvas.getContext("2d"),
        pool = new ParticlePool(settings.particles.length),
        rate = settings.particles.length / settings.particles.duration,
        time;

      function pointOnHeart(t) {
        return new Point(
          160 * Math.pow(Math.sin(t), 3),
          130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
        );
      }

      var img = (() => {
        var c = document.createElement("canvas"), ctx = c.getContext("2d");
        c.width = c.height = settings.particles.size;
        function to(t) {
          var p = pointOnHeart(t);
          p.x = c.width / 2 + p.x * c.width / 350;
          p.y = c.height / 2 - p.y * c.height / 350;
          return p;
        }
        ctx.beginPath();
        var t = -Math.PI, p = to(t);
        ctx.moveTo(p.x, p.y);
        while (t < Math.PI) {
          t += 0.01; p = to(t); ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.fillStyle = "#ff0000"; // Đỏ tươi rực rỡ
        ctx.fill();
        var i = new Image(); i.src = c.toDataURL();
        return i;
      })();

      function render() {
        requestAnimationFrame(render);
        var newTime = new Date().getTime() / 1000, dt = newTime - (time || newTime);
        time = newTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var amount = rate * dt;
        for (var i = 0; i < amount; i++) {
          var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
          var dir = pos.clone().length(settings.particles.velocity);
          pool.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
        }
        pool.update(dt);
        pool.draw(ctx, img);
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();
      render();
    })(document.getElementById("pinkboard"));

    // ---------------- Tim khi click ----------------
    document.addEventListener("click", (e) => {
      const heart = document.createElement("div");
      heart.className = "click-heart";
      heart.innerHTML = "❤️";
      heart.style.left = e.clientX + "px";
      heart.style.top = e.clientY + "px";
      const colors = ["#ff3b3b", "#ff7a00", "#ff00c8", "#00ffe5", "#00ff47", "#fffb00"];
      heart.style.color = colors[Math.floor(Math.random() * colors.length)];
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    });

    // ---------------- Tim nhỏ theo chuột ----------------
    const colorsTrail = ["#ff4d6d", "#ffafcc", "#cdb4db", "#bde0fe", "#a2d2ff", "#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff", "#ffc6ff"];
    let lastSpawn = 0;
    document.addEventListener("pointermove", (e) => {
      const now = performance.now();
      if (now - lastSpawn < 50) return; // Giới hạn tần suất tạo tim để mượt hơn
      lastSpawn = now;
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = `${e.pageX}px`;
      heart.style.top = `${e.pageY}px`;
      heart.style.background = colorsTrail[Math.floor(Math.random() * colorsTrail.length)];
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    });
  </script>
</body>
</html>
